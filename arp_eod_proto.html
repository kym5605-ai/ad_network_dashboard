<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARPDAU 탭 — MTD · E.EOD 시안</title>
<style>
:root{
  --bg:#16171A;--s1:#1D1F24;--s2:#24262C;--s3:#2C2F37;
  --b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.15);
  --t1:#ECEDEE;--t2:#B4B8BE;--t3:#8C9098;
  --acc:#E0A458;--acc-bg:rgba(224,164,88,.12);--acc-br:rgba(224,164,88,.32);
  --grid:rgba(255,255,255,.05);--r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:26px 28px 70px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.head h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
.head .sub{font-size:13px;color:var(--t3)}
.protonote{background:var(--acc-bg);border:1px solid var(--acc-br);border-radius:10px;
  padding:11px 14px;font-size:13.5px;color:var(--t2);margin:14px 0 22px}
.protonote b{color:var(--acc)}
.arp-sect{font-size:13px;color:var(--t3);font-weight:600;letter-spacing:.03em;margin:0 0 8px 2px}
.arp-tiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.arp-tile{background:var(--s1);border:1px solid var(--b1);border-radius:11px;padding:12px 14px;min-width:170px;flex:1;
  cursor:pointer;transition:border-color .12s,background .12s}
.arp-tile:hover{border-color:var(--b2)}
.arp-tile.sel{border-color:var(--acc);background:var(--acc-bg)}
.arp-lab{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px}
.arp-dot{width:9px;height:9px;border-radius:50%;flex:none}
.arp-val{font-size:22px;font-weight:650;margin-top:3px;color:var(--t1);font-variant-numeric:tabular-nums}
.arp-delta{font-size:12px;margin-top:1px;font-variant-numeric:tabular-nums}
.arp-sub{font-size:12px;color:var(--t3);margin-top:5px;font-variant-numeric:tabular-nums}
.arp-eodtag{font-size:10px;color:var(--acc);border:1px solid var(--acc-br);border-radius:5px;padding:0 5px;margin-left:5px;
  vertical-align:1px;font-weight:600}
.arp-card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:16px 18px 12px}
.arp-row2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 2px 10px}
.arp-tabs{display:flex;gap:6px}
.arp-tabs button{background:transparent;border:1px solid var(--b1);color:var(--t3);border-radius:9px;padding:6px 14px;
  font-size:15px;font-family:inherit;cursor:pointer;font-weight:600}
.arp-tabs button.on{background:var(--t1);border-color:var(--t1);color:var(--bg)}
.arp-right{display:flex;gap:8px;align-items:center}
.arp-right button{background:var(--s2);border:1px solid var(--b1);color:var(--t2);border-radius:8px;padding:5px 11px;
  font-size:14px;font-family:inherit;cursor:pointer}
.arp-right button.on{background:#3987e5;border-color:#3987e5;color:#fff}
.arp-right button.eod{border-color:var(--acc-br);color:var(--acc);font-weight:600}
.arp-right button.eod.on{background:var(--acc);border-color:var(--acc);color:#1a1a1a}
.arp-sep{width:1px;height:20px;background:var(--b1);margin:0 2px;display:inline-block}
.arp-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:2px}
.arp-legend span{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--t2)}
.arp-legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.arp-note{color:var(--t3);font-size:13px;margin:10px 2px 2px;line-height:1.7}
/* E.EOD 컨트롤 */
.eodbar{border-top:1px solid var(--b1);margin-top:10px;padding-top:11px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.eodbar label{font-size:13px;color:var(--t3);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.eodbar input[type=range]{width:150px;accent-color:var(--acc);vertical-align:middle}
.eodbar .wv{color:var(--t1);font-variant-numeric:tabular-nums;font-weight:600;min-width:112px;display:inline-block}
.eodsum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.eodsum .c{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:10px 13px;flex:1;min-width:150px}
.eodsum .c .k{font-size:12px;color:var(--t3)}
.eodsum .c .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.eodsum .c .d{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;margin-top:2px}
/* 표 */
table.dt{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
table.dt th,table.dt td{padding:5px 9px;border-bottom:1px solid var(--b1);text-align:right;white-space:nowrap}
table.dt th{color:var(--t3);font-weight:600;font-size:12px;text-align:right}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt tr.proj td{color:var(--acc)}
table.dt tr.sumrow td{border-top:1px solid var(--b2);font-weight:650;color:var(--t1)}
details{margin-top:18px;background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:12px 16px}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--t2);outline:none}
details[open] summary{margin-bottom:10px}
.tt{position:fixed;pointer-events:none;background:var(--s1);border:1px solid var(--b2);border-radius:9px;padding:8px 11px;
  font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .08s;z-index:300;color:var(--t1);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tt .d{color:var(--t3);font-size:12px;margin-bottom:3px}
.warn{color:#E8837B}
</style></head><body>
<div class="wrap">
  <div class="head">
    <h1>ARPDAU 탭 — MTD · E.EOD 시안</h1>
    <span class="sub" id="drange"></span>
  </div>
  <div class="protonote">
    <b>시안(프로토타입)</b> — 대시보드에는 아직 반영하지 않았습니다. 지시하신 <b>MTD</b>(이달 1일~최신일)와
    <b>E.EOD</b>(말일까지 일자별 시뮬레이션)를 각 뷰의 기간 버튼 왼쪽에 붙인 모습입니다.
    말일까지의 예상은 <b>전년 동월 형상</b> 한 가지로만 냅니다 — 확정 구간은 실선, 예상 구간은 점선.
  </div>

  <div class="arp-sect">앱 전체 지표</div>
  <div class="arp-tiles" id="tiles"></div>

  <div class="arp-card">
    <div class="arp-row2">
      <div class="arp-tabs" id="tabs"></div>
      <div class="arp-right" id="ranges"></div>
    </div>
    <div id="eodsum"></div>
    <div class="arp-legend" id="legend"></div>
    <div id="chart"></div>
    <div id="eodbar"></div>
    <div class="arp-note" id="note"></div>
  </div>

</div>

function holFac(name,arr){
  if(_holC[name]) return _holC[name];
  const n=D.dates.length, rat=[[],[],[],[],[],[],[]];
  for(let i=3;i<n-3;i++){
    if(dclass(D.dates[i])) continue;
    let s2=0,ok=true;
    for(let j=i-3;j<=i+3;j++){ if(!arr[j]){ok=false;break;} s2+=arr[j]; }
    if(ok) rat[wdOf(D.dates[i])].push(arr[i]/(s2/7));
  }
  let dow=rat.map(a=>a.length?median(a):1); const g=mean(dow); dow=dow.map(x=>x/g);
  const des=arr.map((v,i)=>v?v/dow[wdOf(D.dates[i])]:null);
  const acc={break_wd:[],break_we:[],hol_wd:[]};
  D.dates.forEach((d,i)=>{
    const c=dclass(d); if(!c||!arr[i]) return;
    const v=[];
    for(let j=Math.max(0,i-10);j<Math.min(n,i+11);j++) if(des[j]&&!dclass(D.dates[j])) v.push(des[j]);
    if(v.length) acc[c].push(arr[i]/(median(v)*dow[wdOf(d)]));
  });
  const F={};
  for(const c in acc) F[c]=acc[c].length>=3?median(acc[c]):null;
  if(F.break_we==null) F.break_we=F.hol_wd;        // 명절 주말 표본이 적으면 일반 공휴일 계수로
  F._n={break_wd:acc.break_wd.length,break_we:acc.break_we.length,hol_wd:acc.hol_wd.length};
  return _holC[name]=F;
}
const hf=(F,ds)=>{const c=dclass(ds); return (c&&F[c])?F[c]:1;};
const p2=n=>String(n).padStart(2,'0');
const dkey=(y,m,d)=>y+'-'+p2(m)+'-'+p2(d);
const DIM=(y,m)=>new Date(y,m,0).getDate();
const WD=(y,m,d)=>new Date(y,m-1,d).getDay();          // 0=일
const WDN='일월화수목금토';
const val=(arr,y,m,d)=>{const i=IDX[dkey(y,m,d)];return i==null?null:arr[i];};
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const mean=a=>a.length?sum(a)/a.length:null;
const median=a=>{const s=a.slice().sort((x,y)=>x-y);const n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;};

/* ── 수집이 덜 끝난 꼬리 날짜 찾기 ──
   매출은 요청수보다 늦게 들어온다. 요청당 RPM 이 직전 한 달 중앙값의 85% 미만이면 미완료로 본다.
   미완료일은 추정의 기준(MTD 일평균)에서 뺀다 — 넣으면 남은 날 예상이 통째로 내려앉는다. */
function lastCompleteIdx(){
  const n=D.dates.length;
  const rpm=i=>D.req[i]?D.rev[i]/D.req[i]*1000:null;
  const base=median(D.dates.map((_,i)=>i).slice(Math.max(0,n-40),n-6).map(rpm).filter(v=>v));
  let e=n-1;
  for(let k=0;k<4;k++){const r=rpm(e); if(r&&base&&r/base>=.85) break; e--;}
  return {idx:e, dropped:D.dates.slice(e+1), base};
}
const LC=lastCompleteIdx();
const LASTD=D.dates[LC.idx];
const CY=+LASTD.slice(0,4), CM=+LASTD.slice(5,7), CE=+LASTD.slice(8,10);   // 이번 달·마지막 완료일
const CDM=DIM(CY,CM);

/* ── A: 전년 동월 형상 ── */
function methodA(arr,Y,M,e,F){
  const Dm=DIM(Y,M), lyD=DIM(Y-1,M), mp=d=>Math.min(lyD,Math.max(1,Math.round(d*lyD/Dm)));
  const ly=[],cur=[];
  for(let d=1;d<=Dm;d++){const k=mp(d), v=val(arr,Y-1,M,k); if(v==null)return null;
    ly.push(v/hf(F,dkey(Y-1,M,k)));}                      // 전년의 공휴일 효과를 걷어낸 순수 형상
  for(let d=1;d<=e;d++){const v=val(arr,Y,M,d); if(v==null)return null;
    cur.push(v/hf(F,dkey(Y,M,d)));}                       // 올해 MTD 도 같은 기준으로
  const base=mean(ly.slice(0,e)); if(!base) return null;
  const m=mean(cur);
  return ly.map((v,i)=>m*v/base*hf(F,dkey(Y,M,i+1)));      // 올해 그 날짜의 공휴일 계수를 다시 입힘
}
/* ── B: 최근 3개월 경향(요일계수 + 감쇠 추세) ── */
function methodB(arr,Y,M,e,F,win){
  win=win||90;
  const end=IDX[dkey(Y,M,e)]; if(end==null) return null;
  const H=[];
  for(let i=Math.max(0,end-win+1);i<=end;i++) if(arr[i]&&!dclass(D.dates[i])) H.push([D.dates[i],arr[i]]);
  if(H.length<35) return null;
  const v=H.map(x=>x[1]);
  const rat=[[],[],[],[],[],[],[]];
  for(let i=3;i<v.length-3;i++){
    let s=0;for(let j=i-3;j<=i+3;j++)s+=v[j];
    const ma=s/7; if(ma) rat[new Date(H[i][0]).getUTCDay()].push(v[i]/ma);
  }
  let dow=rat.map(a=>a.length?median(a):1);
  const g=mean(dow); dow=dow.map(x=>x/g);
  const des=v.map((x,i)=>x/dow[new Date(H[i][0]).getUTCDay()]);
  const level=mean(des.slice(-14));
  const seg=des.slice(-28), nn=seg.length, xm=(nn-1)/2, ym=mean(seg);
  let den=0,num=0; for(let i=0;i<nn;i++){den+=(i-xm)*(i-xm);num+=(i-xm)*(seg[i]-ym);}
  let slope=den?num/den:0;
  slope*=.5;                                    // 감쇠 — 3개월 추세를 그대로 늘리면 과하게 뻗는다
  const cap=.005*level; slope=Math.max(-cap,Math.min(cap,slope));   // 하루 ±0.5% 상한
  const Dm=DIM(Y,M), out=[];
  for(let d=1;d<=Dm;d++) out.push((level+slope*((d-e)+6.5))*dow[WD(Y,M,d)]*hf(F,dkey(Y,M,d)));
  return out;
}
/* ── 한 지표의 일자별 시뮬레이션 ── */
function proj(arr,Y,M,e,name){
  const F=holFac(name||'rev',arr);
  const Dm=DIM(Y,M), A=methodA(arr,Y,M,e,F);
  const B=A?null:methodB(arr,Y,M,e,F);      // 전년 데이터가 없을 때만 폴백
  const act=[],P=[];
  for(let d=1;d<=Dm;d++) act.push(d<=e?val(arr,Y,M,d):null);
  for(let d=1;d<=Dm;d++) P.push(d<=e?act[d-1]:(A?A[d-1]:(B?B[d-1]:null)));
  return {act,A,B,P,Dm,e,fallback:!A,F};
}
function projAll(Y,M,e){
  const R={rev:proj(D.rev,Y,M,e,'rev'), dau:proj(D.dau,Y,M,e,'dau'), req:proj(D.req,Y,M,e,'req')};
  const Dm=R.rev.Dm, arp={act:[],A:[],B:[],P:[],Dm,e,fallback:R.rev.fallback};
  for(let d=0;d<Dm;d++){
    arp.act.push(d<e?R.rev.act[d]/R.dau.act[d]:null);
    arp.A.push((R.rev.A&&R.dau.A)?R.rev.A[d]/R.dau.A[d]:null);
    arp.B.push((R.rev.B&&R.dau.B)?R.rev.B[d]/R.dau.B[d]:null);
    arp.P.push(R.rev.P[d]/R.dau.P[d]);
  }
  R.arp=arp; return R;
}

/* ── 지표 정의 ── */
const man=v=>(v/10000).toFixed(1)+'만';
const eok=v=>v>=1e8?(v/1e8).toFixed(2)+'억':Math.round(v/1e4).toLocaleString()+'만';
const MET={
  dau:{k:'dau',name:'앱 DAU',tab:'DAU',color:'#3987e5',band:'rgba(57,135,229,.18)',arr:()=>D.dau,
       fmt:man,ax:man,agg:'avg',aggLab:'월 일평균'},
  req:{k:'req',name:'요청수',tab:'요청수',color:'#B08CE8',band:'rgba(176,140,232,.18)',arr:()=>D.req,
       fmt:v=>Math.round(v/1e4).toLocaleString()+'만',ax:v=>Math.round(v/1e4).toLocaleString()+'만',agg:'sum',aggLab:'월 합계'},
  rev:{k:'rev',name:'매출',tab:'매출',color:'#5FD08A',band:'rgba(95,208,138,.18)',arr:()=>D.rev,
       fmt:eok,ax:v=>Math.round(v/1e4).toLocaleString()+'만',agg:'sum',aggLab:'월 합계'},
  arp:{k:'arp',name:'앱 ARPDAU',tab:'ARPDAU',color:'#E0A458',band:'rgba(224,164,88,.18)',ratio:true,
       fmt:v=>'₩'+v.toFixed(2),ax:v=>'₩'+v.toFixed(1),agg:'ratio',aggLab:'월 평균'}
};
const ORDER=['dau','req','rev','arp'];

/* ── 상태 ── */
const S={view:'rev',range:'eod',showLY:true};
const R=()=>projAll(CY,CM,CE);

/* ── 월 집계 ── */
function monthAgg(P,k,Y,M,useProj){
  const m=MET[k];
  if(m.agg==='ratio'){
    const rv=useProj?P.rev.P:P.rev.act, du=useProj?P.dau.P:P.dau.act;
    const a=[],b=[];for(let i=0;i<rv.length;i++){if(rv[i]!=null&&du[i]!=null){a.push(rv[i]);b.push(du[i]);}}
    return sum(a)/sum(b);
  }
  const arr=useProj?P[k].P:P[k].act, v=arr.filter(x=>x!=null);
  return m.agg==='avg'?mean(v):sum(v);
}
// upto 를 주면 그 달 1~upto 일만 집계한다(MTD 끼리 견주려고 — 12일치를 한 달 전체와 비교하면 안 된다).
function monthActualAgg(k,Y,M,upto){
  const m=MET[k], Dm=Math.min(DIM(Y,M),upto||99), rv=[],du=[],v=[];
  for(let d=1;d<=Dm;d++){
    const r=val(D.rev,Y,M,d), u=val(D.dau,Y,M,d), x=m.ratio?null:val(m.arr(),Y,M,d);
    if(m.ratio){if(r!=null&&u!=null){rv.push(r);du.push(u);}} else if(x!=null) v.push(x);
  }
  if(m.ratio) return du.length?sum(rv)/sum(du):null;
  if(!v.length) return null;
  return m.agg==='avg'?mean(v):sum(v);
}

/* ── 렌더 ── */
function render(){
  document.getElementById('drange').textContent =
    D.dates[0].replace(/-/g,'.')+' – '+D.dates[D.dates.length-1].replace(/-/g,'.')+
    ' · 수집 완료 '+LASTD.replace(/-/g,'.')+(LC.dropped.length?' (이후 '+LC.dropped.length+'일은 수집 지연)':'');
  const P=R();
  // 타일
  document.getElementById('tiles').innerHTML=ORDER.map(k=>{
    const m=MET[k], eodMode=S.range==='eod';
    const cur=eodMode?monthAgg(P,k,CY,CM,true):monthAgg(P,k,CY,CM,false);
    const pm=CM===1?[CY-1,12]:[CY,CM-1], ly=[CY-1,CM];
    const upto=eodMode?null:CE;      // MTD 는 전월·전년도 같은 일수까지만 잘라서 견준다
    const prev=monthActualAgg(k,pm[0],pm[1],upto), lyv=monthActualAgg(k,ly[0],ly[1],upto);
    const dl=prev?((cur-prev)/prev*100):null, dy=lyv?((cur-lyv)/lyv*100):null;
    return `<div class="arp-tile${S.view===k?' sel':''}" data-k="${k}">
      <div class="arp-lab"><span class="arp-dot" style="background:${m.color}"></span>${m.name}
        ${eodMode?'<span class="arp-eodtag">E.EOD</span>':'<span class="arp-eodtag" style="color:var(--t3);border-color:var(--b1)">MTD</span>'}</div>
      <div class="arp-val">${m.fmt(cur)}</div>
      <div class="arp-delta" style="color:${dy==null?'var(--t3)':(dy>=0?'#5FD08A':'#E8837B')}">${
        dy==null?'—':(dy>=0?'▲':'▼')+' '+Math.abs(dy).toFixed(1)+'% 전년 동월'}</div>
      <div class="arp-sub">${eodMode?m.aggLab:'1~'+CE+'일'} · 전월 대비 ${dl==null?'—':(dl>=0?'+':'')+dl.toFixed(1)+'%'}${eodMode?'':' (같은 일수)'}</div>
    </div>`;}).join('');
  document.querySelectorAll('.arp-tile').forEach(t=>t.onclick=()=>{S.view=t.dataset.k;render();});

  // 서브탭 · 기간
  document.getElementById('tabs').innerHTML=
    ORDER.map(k=>`<button data-v="${k}" class="${S.view===k?'on':''}">${MET[k].tab}</button>`).join('')+
    `<button data-v="combo" class="${S.view==='combo'?'on':''}">전체 뷰</button>`;
  document.getElementById('ranges').innerHTML=
    `<button data-r="eod" class="eod ${S.range==='eod'?'on':''}" title="이달 말일까지 일자별 예상치를 함께 그립니다">E.EOD</button>`+
    `<button data-r="mtd" class="${S.range==='mtd'?'on':''}" title="이달 1일 ~ 수집 완료일">MTD</button>`+
    `<span class="arp-sep"></span>`+
    [90,180,9999].map(r=>`<button data-r="${r}" class="${S.range==r?'on':''}">${r===9999?'전체':r+'일'}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();});
  document.querySelectorAll('#ranges button').forEach(b=>b.onclick=()=>{
    S.range=(b.dataset.r==='eod'||b.dataset.r==='mtd')?b.dataset.r:+b.dataset.r;render();});

  const eodMode=S.range==='eod';
  // E.EOD 요약 + 컨트롤
  document.getElementById('eodsum').innerHTML = eodMode? eodSummary(P):'';
  document.getElementById('eodbar').innerHTML = eodMode?`
    <div class="eodbar">
      <label><input type="checkbox" id="cly" ${S.showLY?'checked':''}> 전년 동월 실적 겹쳐보기</label>
    </div>`:'';
  const cly=document.getElementById('cly');
  if(cly) cly.onchange=e=>{S.showLY=e.target.checked;render();};
  drawChart(P);
  document.getElementById('note').innerHTML = noteHTML(P);
}

function eodSummary(P){
  const k=S.view==='combo'?'rev':S.view, m=MET[k];
  const eod=monthAgg(P,k,CY,CM,true), mtd=monthAgg(P,k,CY,CM,false);
  const pm=CM===1?[CY-1,12]:[CY,CM-1];
  const prev=monthActualAgg(k,pm[0],pm[1]), ly=monthActualAgg(k,CY-1,CM);
  const rest=CDM-CE;
  const d=(a,b)=>b?((a-b)/b*100):null, f=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';
  const col=v=>v==null?'var(--t3)':(v>=0?'#5FD08A':'#E8837B');
  return `<div class="eodsum">
    <div class="c"><div class="k">${S.view==='combo'?m.name+' — ':''}MTD 실적 (${CM}/1~${CM}/${CE})</div><div class="v">${m.fmt(mtd)}</div>
      <div class="d">${CE}일 확정</div></div>
    <div class="c" style="border-color:var(--acc-br);background:var(--acc-bg)">
      <div class="k" style="color:var(--acc)">E.EOD 월말 예상 (${CM}/${CDM})</div>
      <div class="v">${m.fmt(eod)}</div><div class="d">남은 ${rest}일 시뮬레이션 포함</div></div>
    <div class="c"><div class="k">전월(${pm[1]}월) 실적</div><div class="v" style="color:var(--t2)">${prev==null?'—':m.fmt(prev)}</div>
      <div class="d" style="color:${col(d(eod,prev))}">${f(d(eod,prev))} 전월 대비</div></div>
    <div class="c"><div class="k">전년 동월(${CY-1}.${p2(CM)}) 실적</div><div class="v" style="color:var(--t2)">${ly==null?'—':m.fmt(ly)}</div>
      <div class="d" style="color:${col(d(eod,ly))}">${f(d(eod,ly))} YoY</div></div>
  </div>`;
}

/* ── 차트 ── */
const SVGNS='http://www.w3.org/2000/svg';
function drawChart(P){
  const host=document.getElementById('chart');
  const W=Math.max(680,host.clientWidth||1000), H=400, M={l:70,r:20,t:14,b:44};
  const eodMode=S.range==='eod', mtdMode=S.range==='mtd';
  const view=S.view, isCombo=view==='combo';
  let xs=[], series=[], bands=[], marks=[], spans=[];

  if(eodMode||mtdMode){
    const last=mtdMode?CE:CDM;
    for(let d=1;d<=last;d++) xs.push(d);
    const xlab=d=>CM+'/'+d;
    const keys=isCombo?['dau','rev','arp']:[view];
    keys.forEach(k=>{
      const m=MET[k], pr=P[k];
      const act=xs.map(d=>d<=CE?pr.act[d-1]:null);
      const idxr=isCombo? (v,base)=>v==null?null:v/base*100 : v=>v;
      const base=isCombo? mean(xs.slice(0,7).map(d=>pr.act[d-1]).filter(v=>v!=null)) : 1;
      series.push({name:m.name+(isCombo?' (지수)':''),color:m.color,dash:null,
        pts:xs.map((d,i)=>[i, isCombo?idxr(act[i],base):act[i]])});
      if(eodMode) series.push({name:m.name+' 예상',color:m.color,dash:'6 4',
        pts:xs.map((d,i)=>[i, d<CE?null:(isCombo?idxr(pr.P[d-1],base):pr.P[d-1])])});
      if(S.showLY&&!isCombo&&(eodMode||mtdMode)){
        const lyD=DIM(CY-1,CM);
        series.push({name:CY-1+'.'+p2(CM)+' 실적',color:'#585C63',dash:'2 3',thin:true,
          pts:xs.map((d,i)=>{const v=MET[k].ratio
              ?(()=>{const r=val(D.rev,CY-1,CM,Math.min(lyD,d)),u=val(D.dau,CY-1,CM,Math.min(lyD,d));return (r!=null&&u)?r/u:null;})()
              :val(MET[k].arr(),CY-1,CM,Math.min(lyD,d));
            return [i,v];})});
      }
    });
    if(eodMode) marks.push({x:CE-1,label:'수집 완료 '+CM+'/'+CE});
    // 이달에 걸친 명절 연휴는 음영으로 표시한다 — 점선이 왜 내려앉는지 그림에서 바로 보이게
    BREAKS.forEach(b=>{
      const a=[],z=[];
      for(let d=1;d<=last;d++){const ds=dkey(CY,CM,d); if(ds>=b[0]&&ds<=b[1]){a.push(d);z.push(d);} }
      if(a.length) spans.push({x0:a[0]-1,x1:z[z.length-1]-1,label:b[2]+' 연휴'});
    });
    drawSVG(host,W,H,M,xs.map(xlab),series,bands,marks,isCombo?v=>Math.round(v):MET[isCombo?'rev':view].ax,
      isCombo?'지수(1~7일=100)':MET[view].name,spans);
  }else{
    const n=Math.min(S.range,D.dates.length), st=D.dates.length-n;
    const dd=D.dates.slice(st);
    const keys=isCombo?['dau','rev','arp']:[view];
    keys.forEach(k=>{
      const m=MET[k];
      const raw=dd.map((d,i)=>{const j=IDX[d];
        return m.ratio?(D.dau[j]?D.rev[j]/D.dau[j]:null):m.arr()[j];});
      const base=isCombo?mean(raw.slice(0,7).filter(v=>v!=null)):1;
      series.push({name:m.name+(isCombo?' (지수)':''),color:m.color,dash:null,
        pts:raw.map((v,i)=>[i,v==null?null:(isCombo?v/base*100:v)])});
    });
    drawSVG(host,W,H,M,dd.map(d=>d.slice(5).replace('-','/')),series,[],[],
      isCombo?v=>Math.round(v):MET[isCombo?'rev':view].ax, isCombo?'지수(시작일=100)':MET[view].name,[]);
  }
  document.getElementById('legend').innerHTML=series.map(s=>
    `<span><i style="background:${s.color};${s.dash?'height:0;border-top:3px '+(s.dash==='6 4'?'dashed':'dotted')+' '+s.color:''}"></i>${s.name}</span>`).join('');
}

function drawSVG(host,W,H,M,labels,series,bands,marks,axfmt,ylab,spans){
  const n=labels.length, IW=W-M.l-M.r, IH=H-M.t-M.b;
  let lo=Infinity,hi=-Infinity;
  series.forEach(s=>s.pts.forEach(p=>{if(p[1]!=null){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1]);}}));
  bands.forEach(b=>[b.lo,b.hi].forEach(a=>a.forEach(p=>{if(p[1]!=null){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1]);}})));
  if(!isFinite(lo)){host.innerHTML='<div style="color:var(--t3);padding:40px">데이터 없음</div>';return;}
  if(lo===hi){lo*=.9;hi*=1.1;}
  const pad=(hi-lo)*.12; lo=Math.max(0,lo-pad); hi=hi+pad;
  const X=i=>M.l+(n<=1?0:IW*i/(n-1)), Y=v=>M.t+IH-(v-lo)/(hi-lo)*IH;
  let g='';
  // 격자·y눈금
  for(let t=0;t<=4;t++){const v=lo+(hi-lo)*t/4, y=Y(v);
    g+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--grid)"/>`+
       `<text x="${M.l-8}" y="${y+4}" fill="var(--t3)" font-size="11.5" text-anchor="end">${axfmt(v)}</text>`;}
  // x눈금
  const step=Math.max(1,Math.ceil(n/14));
  labels.forEach((L,i)=>{if(i%step&&i!==n-1)return;
    g+=`<text x="${X(i)}" y="${H-M.b+20}" fill="var(--t3)" font-size="11.5" text-anchor="middle">${L}</text>`;});
  // 연휴 음영
  (spans||[]).forEach(sp=>{
    const half=n>1?IW/(2*(n-1)):0, x0=X(sp.x0)-half, x1=X(sp.x1)+half;
    g+=`<rect x="${x0}" y="${M.t}" width="${Math.max(2,x1-x0)}" height="${IH}" fill="rgba(232,131,123,.10)"/>`+
       `<text x="${(x0+x1)/2}" y="${M.t+13}" fill="#E8837B" font-size="11.5" text-anchor="middle" opacity=".85">${sp.label}</text>`;});
  // 밴드
  bands.forEach(b=>{
    const up=b.hi.filter(p=>p[1]!=null), dn=b.lo.filter(p=>p[1]!=null).reverse();
    if(up.length<2)return;
    g+=`<path d="M${up.map(p=>X(p[0])+' '+Y(p[1])).join(' L')} L${dn.map(p=>X(p[0])+' '+Y(p[1])).join(' L')} Z" fill="${b.color}" stroke="none"/>`;});
  // 세로 마커
  marks.forEach(mk=>{const x=X(mk.x);
    g+=`<line x1="${x}" y1="${M.t}" x2="${x}" y2="${M.t+IH}" stroke="var(--b2)" stroke-dasharray="3 4"/>`+
       `<text x="${x+6}" y="${M.t+13}" fill="var(--t3)" font-size="11.5">${mk.label}</text>`;});
  // 선
  series.forEach(s=>{
    let d='',open=false;
    s.pts.forEach(p=>{if(p[1]==null){open=false;return;}
      d+=(open?' L':' M')+X(p[0])+' '+Y(p[1]); open=true;});
    if(d) g+=`<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="${s.thin?1.4:2.2}"
      ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" opacity="${s.thin?.8:1}"/>`;});
  // 호버 타깃
  for(let i=0;i<n;i++) g+=`<rect class="hv" data-i="${i}" x="${X(i)-IW/(2*Math.max(1,n-1))}" y="${M.t}"
    width="${IW/Math.max(1,n-1)}" height="${IH}" fill="transparent"/>`;
  host.innerHTML=`<svg id="svg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
    <text x="${W-M.r}" y="${H-8}" fill="var(--t3)" font-size="11.5" text-anchor="end">${ylab}</text>${g}</svg>`;
  const tt=document.getElementById('tt');
  host.querySelectorAll('.hv').forEach(r=>{
    r.onmousemove=ev=>{
      const i=+r.dataset.i;
      tt.innerHTML=`<div class="d">${labels[i]}</div>`+series.map(s=>{
        const p=s.pts[i]; if(!p||p[1]==null) return '';
        return `<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:6px"></span>${s.name} <b>${axfmt(p[1])}</b></div>`;
      }).join('');
      tt.style.opacity=1; tt.style.left=Math.min(window.innerWidth-260,ev.clientX+14)+'px'; tt.style.top=(ev.clientY+14)+'px';};
    r.onmouseleave=()=>tt.style.opacity=0;});
}

/* ── 설명 ── */
function noteHTML(P){
  if(S.range==='eod'){
    const k=S.view==='combo'?'rev':S.view;
    const P=R();
    return `<b style="color:var(--t2)">E.EOD</b> = 이달 말일(${CM}/${CDM}) 기준 예상. 확정된 ${CE}일(실선)은 실적 그대로,
      남은 ${CDM-CE}일(점선)은 <b style="color:var(--t2)">전년 동월 형상</b>으로 채웠습니다 —
      올해 1~${CE}일 일평균에 전년 같은 달의 날짜별 형상(그날 ÷ 같은 일수 일평균)을 입힌 값입니다.
      월 합계로 보면 <b style="color:var(--t2)">당월 누적 × (전년 동월 전체 ÷ 전년 동월 같은 일수 누적)</b>이 되어
      주간보고 「기간 매출」 타일에 쓰는 공식과 같습니다.
      ${(()=>{const F=P[k].F, br=BREAKS.filter(b=>b[0].slice(0,7)===CY+'-'+p2(CM));
        if(!br.length) return '';
        const pc=v=>v==null?'—':Math.round((1-v)*100)+'%';
        return `<br><b style="color:#E8837B">${br[0][2]} 연휴 보정</b> — ${br[0][0].slice(5).replace('-','/')}~${br[0][1].slice(5).replace('-','/')}.
          전년 같은 달엔 명절이 없어 형상만으로는 이 낙폭을 못 잡습니다. 그래서 과거 명절 연휴(설날·추석 ${F._n.break_wd}일)에서
          <b style="color:var(--t2)">평일 -${pc(F.break_wd)} · 주말 -${pc(F.break_we)}</b>(같은 요일 평소 대비)를 뽑아 그 사흘에만 따로 입혔습니다.`;})()}
      ${dkey(CY,CM,CDM)>HOL_UNTIL?`<br><span class="warn">※ 공휴일 목록이 ${HOL_UNTIL}까지만 채워져 있습니다 — 그 이후 공휴일은 평일로 계산됩니다. 목록을 연장하세요.</span>`:''}
      ${P[k].fallback?'<br><span class="warn">※ 전년 데이터가 없어 최근 3개월 경향으로 대체했습니다.</span>':''}
      ${LC.dropped.length?`<br><span class="warn">※ ${LC.dropped.map(d=>d.slice(5)).join(', ')} 은 매출 수집이 덜 끝난 것으로 보여(요청당 단가가 평소의 ${Math.round(D.rev[D.dates.length-1]/D.req[D.dates.length-1]*1000/LC.base*100)}%) 기준에서 제외했습니다.</span>`:''}
      ${MET[k].ratio?'<br>ARPDAU는 비율을 직접 추정하지 않고 매출·DAU를 각각 추정해 나눈 값입니다.':''}`;
  }
  if(S.range==='mtd') return `<b style="color:var(--t2)">MTD</b> = 이달 1일 ~ 수집 완료일(${LASTD.replace(/-/g,'.')}) 실적만. 예상치 없음.`;
  return `최근 ${S.range===9999?'전체':S.range+'일'} 일별 실적.`;
}

/* ── 백테스트 ── */
function backtest(){
  const out=[];
  ['rev','dau','req'].forEach(k=>{
    const m=MET[k], arr=k==='rev'?D.rev:k==='dau'?D.dau:D.req, rows=[];
    for(let M_=1;M_<=12;M_++){
      const Y=2026, Dm=DIM(Y,M_); if(!IDX[dkey(Y,M_,Dm)]) continue;
      const e=13; let act=[],ok=true;
      for(let d=1;d<=Dm;d++){const v=val(arr,Y,M_,d); if(v==null){ok=false;break;} act.push(v);}
      if(!ok) continue;
      const tot=sum(act), sP=sum(proj(arr,Y,M_,e,k).P), simple=sum(act.slice(0,e))/e*Dm;
      const er=x=>(x-tot)/tot*100;
      rows.push({M:M_,tot,eP:er(sP),eS:er(simple)});
    }
    if(!rows.length) return;
    const f=v=>(v>=0?'+':'')+v.toFixed(1)+'%', avg=a=>mean(a.map(Math.abs));
    out.push(`<div style="margin:14px 0 4px;font-size:13px;color:var(--t2);font-weight:600">${m.name} — 매월 13일 시점에서 월 합계를 맞혔는지</div>
      <table class="dt"><thead><tr><th>월</th><th>실제</th><th>E.EOD (전년 동월 형상)</th><th>참고: 단순 일평균×일수</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>2026-${p2(r.M)}</td><td>${m.fmt(r.tot)}</td><td><b>${f(r.eP)}</b></td>
        <td style="color:var(--t3)">${f(r.eS)}</td></tr>`).join('')}
      <tr class="sumrow"><td>평균 절대오차</td><td></td><td>${avg(rows.map(r=>r.eP)).toFixed(1)}%</td>
        <td style="color:var(--t3)">${avg(rows.map(r=>r.eS)).toFixed(1)}%</td></tr></tbody></table>`);
  });
  return out.join('')+`<div class="arp-note">전년 데이터가 있는 2026년 달만 검증할 수 있습니다(원본이 2025-01부터).
    요청수는 신규 지면이 달 중간에 열리면 전년 형상이 깨져 오차가 큽니다 — 매출·DAU보다 느슨하게 보셔야 합니다.</div>`;
}
document.getElementById('bt').addEventListener('toggle',function(){
  if(this.open) document.getElementById('btbody').innerHTML=backtest();
});
render();
window.addEventListener('resize',()=>drawChart(R()));
